name: Deploy demo app

on:
  push:
    branches: [main]
    paths:
      - 'demo-app/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options: [dev, test, prod]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: demo-app/backend/package-lock.json

      - name: Install backend deps
        working-directory: demo-app/backend
        run: npm install

      - name: Run smoke test
        working-directory: demo-app/backend
        run: npm test

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      # Deploys over SSH using the app EC2's public IP. Prefer swapping this
      # for AWS SSM `send-command` in production — it avoids opening port 22
      # and needing a long-lived private key in GitHub Secrets at all.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/demo-app
            git pull origin main
            cd backend
            npm install --production
            pm2 restart demo-backend
            sudo cp -r ../frontend/* /var/www/html/
            sudo systemctl reload nginx
